# Local development — builds from source.
# Usage: docker compose -f docker-compose.dev.yml up -d --build
services:
  s3-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: s3-server:dev
    container_name: s3-server
    restart: unless-stopped
    ports:
      - "${S3_SERVER_PORT:-8080}:8080"
    volumes:
      - s3-server-data:/var/lib/s3-server
    environment:
      - S3_SERVER_LOG_LEVEL=${S3_SERVER_LOG_LEVEL:-info}
      - S3_SERVER_LOG_FORMAT=${S3_SERVER_LOG_FORMAT:-json}

volumes:
  s3-server-data:
